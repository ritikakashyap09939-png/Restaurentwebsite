kind = "web"
previewPath = "/"
title = "Nirmal Family Restaurant and Party Hall"
description = "A professional multi-page restaurant and banquet hall website for Nirmal Family Restaurant and Party Hall, featuring home, about, menu with veg/non-veg filters, party hall booking, gallery, testimonials, and contact pages."
version = "1.0.0"
id = "artifacts/nirmal-restaurant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19801

[services.development]
run = "pnpm --filter @workspace/nirmal-restaurant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nirmal-restaurant", "run", "build" ]
serve = "static"
publicDir = "artifacts/nirmal-restaurant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19801"
BASE_PATH = "/"
